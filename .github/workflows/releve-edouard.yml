name: Relève des rapports Edouard (toutes les heures)

# Va chercher toutes les heures les états des lieux terminés dans Edouard
# (api/edouard-cron.js) : le rapport PDF apparaît dans le CRM (Clients ›
# Rapports) et dans l'espace de l'agence quasi immédiatement, au lieu
# d'attendre la relève du soir (cron reminder-rdv, qui reste en secours).
# Planifié ici plutôt que dans vercel.json : les crons Vercel du forfait
# actuel sont limités à une exécution par jour.
#
# Prérequis (une fois) : secret de dépôt CRON_SECRET = même valeur que la
# variable CRON_SECRET de Vercel (Settings › Secrets and variables › Actions).
# Les planifications GitHub ne tournent que depuis la branche par défaut.

on:
  schedule:
    - cron: '7 * * * *'
  workflow_dispatch:

jobs:
  releve:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Relever les rapports Edouard
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$CRON_SECRET" ]; then
            echo "::warning::Secret CRON_SECRET absent : relève ignorée."
            exit 0
          fi
          curl -fsS --max-time 120 \
            -H "Authorization: Bearer $CRON_SECRET" \
            https://app.lokentia.fr/api/edouard-cron | head -c 2000
